name: C/C++ CI

on: [push]

defaults:
  run:
    shell: bash

env:
  # Use a recent stable vcpkg baseline from official Microsoft repo
  VCPKG_COMMIT: de46587b4beaa638743916fe5674825cecfb48b3

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        MH_STUFF_COMPILE_LIBRARY: [true, false]
        compiler:
          # Modern compilers available on ubuntu-latest (Ubuntu 22.04/24.04)
          # 'gcov' selects the matching gcov for coverage; coverage is GCC-only
          # (clang would need its profile runtime + llvm-cov, which we don't install)
          - exe: g++-12
            deps: g++-12
            gcov: gcov-12
          - exe: g++-13
            deps: g++-13
            gcov: gcov-13
          - exe: clang++-14
            deps: clang-14 libc++-14-dev libc++abi-14-dev
          - exe: clang++-15
            deps: clang-15 libc++-15-dev libc++abi-15-dev

    steps:
    - uses: actions/checkout@v4

    - uses: lukka/run-vcpkg@v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

    - name: Install compilers and tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.compiler.deps }} ninja-build
        pip3 install gcovr

        echo "Ensuring programs work..."
        ${{ matrix.compiler.exe }} --version
        ninja --version
        gcovr --version

    # - name: Run tests
    #   working-directory: ./test
    #   run: make -j`grep -c ^processor /proc/cpuinfo` ${{ matrix.compiler }}_test_output.txt

    - name: Build
      env:
        CXX: ${{ matrix.compiler.exe }}
        CXXFLAGS: -Wall -Wpedantic -Wextra -Werror
      run: |
        mkdir build
        cd build

        cmake --version

        cmake -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DMH_STUFF_COMPILE_LIBRARY=${{ matrix.MH_STUFF_COMPILE_LIBRARY }} \
          ../

        cmake --build .

    - name: Run tests
      env:
        CXX: ${{ matrix.compiler.exe }}
      run: |
        cd build

        ctest --version
        ctest --output-on-failure

    - name: Generate coverage report
      if: matrix.compiler.gcov != ''
      run: |
        gcovr --version
        # Run gcovr from the REPO ROOT with the build dir as the search path.
        # Running it from inside the build dir with --root ../ made gcovr
        # silently drop every file outside the build dir (all of cpp/include,
        # cpp/src and test/) - the uploaded report contained nothing but
        # Catch2/_deps sources. The explicit --filter keeps the report to
        # library code, which also covers everything the old --exclude list
        # (catch.hpp, test/, generated test_compile_file TUs) was for.
        gcovr --gcov-executable "${{ matrix.compiler.gcov }}" --root . --filter 'cpp/include/' --filter 'cpp/src/' --sort uncovered-percent --html-details "build/results_${{ matrix.compiler.exe }}.html" build

    - name: Save test results
      if: matrix.MH_STUFF_COMPILE_LIBRARY && matrix.compiler.gcov != ''
      uses: actions/upload-artifact@v4
      with:
        name: gcovr_results_${{ matrix.compiler.exe }}
        path: build/results*.html



