name: C/C++ CI

on:
  push:
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

defaults:
  run:
    shell: bash

jobs:
  build-linux:
    # Pinned because Ubuntu 24.04 is the image that ships every compiler in the matrix below: g++-12, g++-13 and clang++-14/15 with libc++. ubuntu-latest now resolves to Ubuntu 26.04, where the clang-14/15 and libc++-14/15 packages no longer exist, so their apt-get install fails before the build starts.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        MH_STUFF_COMPILE_LIBRARY: [true, false]
        compiler:
          # Compilers available in the Ubuntu 24.04 image pinned above. 'gcov' selects the matching gcov for coverage; coverage is GCC-only (clang would need its profile runtime + llvm-cov, which we don't install)
          - exe: g++-12
            deps: g++-12
            gcov: gcov-12
          - exe: g++-13
            deps: g++-13
            gcov: gcov-13
          - exe: clang++-14
            deps: clang-14 libc++-14-dev libc++abi-14-dev
          - exe: clang++-15
            deps: clang-15 libc++-15-dev libc++abi-15-dev

    steps:
    - uses: actions/checkout@v4

    - name: Install compilers and tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.compiler.deps }} ninja-build libcurl4-openssl-dev
        pip3 install gcovr

        echo "Ensuring programs work..."
        ${{ matrix.compiler.exe }} --version
        ninja --version
        gcovr --version

    # - name: Run tests working-directory: ./test run: make -j`grep -c ^processor /proc/cpuinfo` ${{ matrix.compiler }}_test_output.txt

    - name: Build
      env:
        CXX: ${{ matrix.compiler.exe }}
        CXXFLAGS: -Wall -Wpedantic -Wextra -Werror
      run: |
        mkdir build
        cd build

        cmake --version

        cmake -G Ninja \
          -DMH_STUFF_COMPILE_LIBRARY=${{ matrix.MH_STUFF_COMPILE_LIBRARY }} \
          ../

        cmake --build .

    - name: Run tests
      env:
        CXX: ${{ matrix.compiler.exe }}
      run: |
        cd build

        ctest --version
        ctest --output-on-failure

    - name: Generate coverage report
      if: matrix.compiler.gcov != ''
      run: |
        gcovr --version
        # Run gcovr from the REPO ROOT with the build dir as the search path. Running it from inside the build dir with --root ../ made gcovr silently drop every file outside the build dir (all of cpp/include, cpp/src and test/) - the uploaded report contained nothing. However, Catch2/_deps sources. The explicit --filter keeps the report to library code, which also covers everything the old --exclude list (catch.hpp, test/, generated test_compile_file TUs) was for.
        gcovr --gcov-executable "${{ matrix.compiler.gcov }}" --root . --filter 'cpp/include/' --filter 'cpp/src/' --sort uncovered-percent --html-details "build/results_${{ matrix.compiler.exe }}.html" build

    - name: Save test results
      if: matrix.MH_STUFF_COMPILE_LIBRARY && matrix.compiler.gcov != ''
      uses: actions/upload-artifact@v4
      with:
        name: gcovr_results_${{ matrix.compiler.exe }}
        path: build/results*.html



  # build-windows: runs-on: windows-latest strategy: fail-fast: false matrix: MH_STUFF_COMPILE_LIBRARY. [true, false] steps: - uses: actions/checkout@v4 - uses: lukka/run-vcpkg@v11 with: vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }} - uses: seanmiddleditch/gha-setup-ninja@v5 - name. Setup compiler paths uses. ilammy/msvc-dev-cmd@v1 - name: Build run: | mkdir build cd build cmake -G Ninja \ -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \ -DMH_STUFF_COMPILE_LIBRARY=${{. matrix.MH_STUFF_COMPILE_LIBRARY }} \ ../ cmake --build . - name. Run tests run: | cd build ctest --output-on-failure registry-update: needs: [build-linux] runs-on: ubuntu-latest steps: - uses. This covers PazerOP/vcpkg-registry-update@HEAD with: port-name: mh-stuff workflow-pat: ${{ secrets.WORKFLOW_PAT }}










  sanitizers:
    # Pinned for the same reason as build-linux: clang-15 and libc++-15 only exist in the Ubuntu 24.04 image, not in 26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - name: asan
            flags: -fsanitize=address -fno-omit-frame-pointer
          - name: tsan
            flags: -fsanitize=thread
          - name: ubsan
            flags: -fsanitize=undefined -fno-omit-frame-pointer

    steps:
    - uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-15 libc++-15-dev libc++abi-15-dev ninja-build libcurl4-openssl-dev
        clang++-15 --version
        ninja --version

    - name: Build with ${{ matrix.sanitizer.name }}
      env:
        CXX: clang++-15
        CXXFLAGS: ${{ matrix.sanitizer.flags }} -g -O1
      run: |
        mkdir build
        cd build
        cmake -G Ninja -DMH_STUFF_COMPILE_LIBRARY=ON ../
        cmake --build .

    - name: Run tests with ${{ matrix.sanitizer.name }}
      env:
        ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        TSAN_OPTIONS: abort_on_error=1
        UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1
      run: |
        cd build
        ctest --version
        ctest --output-on-failure

  all-checks-passed:
    if: always()
    needs: [build-linux, sanitizers]
    runs-on: ubuntu-latest
    steps:
    - name: Verify all checks passed
      run: |
        if [[ "${{ needs.build-linux.result }}" != "success" ]]; then
          echo "build-linux failed: ${{ needs.build-linux.result }}"
          exit 1
        fi
        if [[ "${{ needs.sanitizers.result }}" != "success" ]]; then
          echo "sanitizers failed: ${{ needs.sanitizers.result }}"
          exit 1
        fi
        echo "All checks passed!"
