  all-checks-passed:
    if: always()
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
    - name: Verify all checks passed
      run: |
        if [[ "${{ needs.build-linux.result }}" != "success" ]]; then
          echo "build-linux failed: ${{ needs.build-linux.result }}"
          exit 1
        fi
        echo "All checks passed!"
